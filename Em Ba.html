<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Em Ba - AI của gia đình</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#faf7f2;--panel:#fff;--ink:#2a2430;--mute:#7a7184;--line:#ece5dc;--a:#7c5cff;--b:#ff7a6b;--soft:#f1ecff;--me:#efe9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1820;--panel:#252130;--ink:#f1edf6;--mute:#a49bb3;--line:#352f43;--soft:#2e2745;--me:#322a52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1820;--panel:#252130;--ink:#f1edf6;--mute:#a49bb3;--line:#352f43;--soft:#2e2745;--me:#322a52;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.grad{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--a)}
.btn:disabled{opacity:.5;cursor:default}
#app{height:100%;display:flex}
.center{margin:auto;max-width:400px;width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
.logo{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-size:28px}
.center h1{margin:0 0 6px;font-size:22px}.center p{color:var(--mute);margin:0 0 18px}
.center input,.center select{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
aside{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .logo{width:36px;height:36px;margin:0;font-size:18px;border-radius:12px}
.me{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}.me b{display:block}
h3{margin:6px 0 0;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.file{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.file span{flex:1;word-break:break-word}.file small{display:block;color:var(--mute)}
.file button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hello{text-align:center;margin-top:8vh}.hello h2{font-size:26px;margin:8px 0}.hello p{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.msg{padding:12px 16px;border-radius:18px;white-space:pre-wrap;word-break:break-word;max-width:88%}
.md{white-space:normal!important}.md p{margin:0 0 8px;white-space:pre-wrap}.md p:last-child{margin:0}.md pre{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0;overflow-x:auto;white-space:pre}.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}.md :not(pre)>code{background:var(--soft);padding:1px 5px;border-radius:5px}.md ul,.md ol{margin:0 0 8px;padding-left:22px}.md h4{margin:8px 0 4px}
.msg.u{align-self:flex-end;background:var(--me)}.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.bar{padding:12px 16px 16px}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px}
.box textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:140px;padding:6px 0}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:6px}
.menu{display:none}
.hd{display:none}.ab{display:contents}.brand{order:-2}.me{order:-1}
@media (max-width:760px){#app{flex-direction:column}aside{width:100%;max-height:62vh;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px;flex-shrink:0}.hd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--soft);color:var(--a);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}.hd i{font-style:normal;font-size:16px;line-height:1}.ab{display:flex;flex-direction:column;gap:10px}aside.shut .ab{display:none}.brand{order:0}.me{order:0}}
.att{max-width:720px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:8px}
.ac{display:flex;align-items:center;gap:6px;background:var(--soft);color:var(--a);border-radius:12px;padding:4px 10px;font-size:14px}.ac img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.pop{max-width:720px;margin:0 auto 8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column}
.pop[hidden]{display:none}.pop button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}.pop button:hover{background:var(--soft)}
.att[hidden]{display:none}
.att button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:15px}
.hl{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;border:3px solid var(--panel);box-shadow:0 4px 18px rgba(124,92,255,.35)}.bl{width:36px;height:36px;border-radius:50%;object-fit:cover}
</style>
</head>

function logoImg(c){const i=document.createElement('img');i.className=c;i.src=LOGO;i.alt='Gia đình';return i}
const st={db:null,user:null,sample:null,me:null,meId:null,files:[],hist:[],busy:false,imgs:[],mode:'help',persona:'Mẹ'};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function screen(icon,title,text,extra){
  app.replaceChildren();
  const c=el('div','center');
  const l=el('div','logo grad',icon);c.append(l,el('h1',null,title),el('p',null,text));
  if(extra)c.append(extra);app.append(c);
}

const ROLES=['Bố','Mẹ','Anh Hai','Chị Hai','Em út'];
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function hashPw(pw,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const s=salt+':'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'x'+h}
}
const gptCfg=()=>LS.get('nm_gpt')||{};
const accs=()=>LS.get('nm_accounts')||[];
const field=(ph,type)=>{const i=el('input');i.placeholder=ph;if(type)i.type=type;return i};
function enter(a){st.me={id:a.id,name:a.name,role:a.role};LS.set('nm_session',a.id);st.hist=[];st.doc=null;st.imgs=[];start()}
function errP(){const e=el('p');e.style.cssText='color:var(--b);margin:10px 0 0';return e}
function register(){
  const n=field('Tên của bạn (vd: Lan)'),r=el('select');ROLES.forEach(x=>r.append(new Option(x,x)));
  const p=field('Mật khẩu (ít nhất 4 ký tự)','password'),p2=field('Nhập lại mật khẩu','password');
  const b=el('button','btn grad','Đăng ký và vào nhà');b.style.width='100%';
  const err=errP(),f=el('div');f.append(n,r,p,p2,b,err);
  if(accs().length){const k=el('button','btn ghost','Đã có tài khoản? Đăng nhập');k.style.cssText='width:100%;margin-top:10px';k.onclick=login;f.append(k)}
  b.onclick=async()=>{
    const name=n.value.trim();
    if(!name){err.textContent='Bạn nhớ nhập tên nhé.';return}
    if(p.value.length<4){err.textContent='Mật khẩu cần ít nhất 4 ký tự.';return}
    if(p.value!==p2.value){err.textContent='Hai mật khẩu chưa giống nhau.';return}
    const l=accs();
    if(l.some(a=>a.name.toLowerCase()===name.toLowerCase()&&a.role===r.value)){err.textContent='Tài khoản này đã có, bạn hãy đăng nhập nhé.';return}
    b.disabled=true;
    const salt=Math.random().toString(36).slice(2),a={id:'u'+Date.now().toString(36),name,role:r.value,salt,hash:await hashPw(p.value,salt),joined:Date.now()};
    l.push(a);LS.set('nm_accounts',l);enter(a);
  };
  screen('👋','Chào mừng đến Nhà Mình AI','Tạo tài khoản gia đình để bắt đầu.',f);
}
function login(){
  const l=accs();if(!l.length){register();return}
  const s=el('select');l.forEach(a=>s.append(new Option(a.role+' '+a.name,a.id)));
  const p=field('Mật khẩu','password'),b=el('button','btn grad','Đăng nhập');b.style.width='100%';
  const err=errP(),k=el('button','btn ghost','Tạo tài khoản mới');k.style.cssText='width:100%;margin-top:10px';k.onclick=register;
  b.onclick=async()=>{const a=l.find(x=>x.id===s.value);if(a&&await hashPw(p.value,a.salt)===a.hash)enter(a);else{err.textContent='Mật khẩu chưa đúng, bạn thử lại nhé.';p.value=''}};
  p.onkeydown=e=>{if(e.key==='Enter')b.click()};
  const f=el('div');f.append(s,p,b,err,k);
  screen('🏡','Đăng nhập','Chọn tài khoản của bạn rồi nhập mật khẩu.',f);
}
async function init(){
  try{st.sample=await claude.use('sample')}catch(e){}
  st.engine=st.sample?'online':(gptCfg().key?'gpt':'local');
  const a=accs().find(x=>x.id===LS.get('nm_session'));
  if(a)enter(a);else accs().length?login():register();
}

const hKey=()=>'nm_h_'+st.me.id+'_'+st.mode+(st.mode==='talk'?'_'+st.persona:'');
const readH=()=>{const v=LS.get(hKey());return Array.isArray(v)?v:[]};
const saveH=()=>LS.set(hKey(),st.hist.slice(-100));
function showH(){const w=$('#wrap');if(!w)return;if(!st.hist.length){hello();return}w.replaceChildren();st.hist.forEach(h=>{const m=addMsg(h.r==='u'?'u':'a',h.r==='u'?h.t:'');if(h.r!=='u')md(m,h.t)});$('#chat').scrollTop=1e9}
function start(){
  app.replaceChildren();
  const side=el('aside');
  const br=el('div','brand');const lg=logoImg('bl');br.append(lg,el('span',null,'Nhà Mình AI'));
  const me=el('div','me');me.append(el('b',null,st.me.name),document.createTextNode(st.me.role+' trong gia đình'));
  const nc=el('button','btn ghost','＋ Trò chuyện mới (xóa lịch sử mục này)');
  nc.onclick=()=>{if(st.busy)return;st.hist=[];saveH();st.doc=null;st.imgs=[];renderAtt();hello()};
  const mb=el('div');mb.style.cssText='display:flex;gap:6px';
  const pr=el('select');pr.title='Bạn muốn tâm sự với ai?';['Mẹ','Ba','Chị','Anh','Bà','Ông'].forEach(x=>pr.append(new Option('Tâm sự với '+x,x)));pr.style.cssText='padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)';
  pr.onchange=()=>{st.persona=pr.value;st.hist=readH();showH()};
  const bg=el('button','btn','✨ Đa năng'),bh=el('button','btn','🏡 Trợ lý'),bt=el('button','btn','💛 Tâm sự');
  const setM=m=>{st.mode=m;st.hist=readH();pr.hidden=m!=='talk';bg.className='btn '+(m==='gen'?'grad':'ghost');bh.className='btn '+(m==='help'?'grad':'ghost');bt.className='btn '+(m==='talk'?'grad':'ghost');showH()};
  bh.onclick=()=>{if(!st.busy)setM('help')};bt.onclick=()=>{if(!st.busy)setM('talk')};
  bg.onclick=()=>{if(!st.busy)setM('gen')};mb.append(bg,bh,bt);mb.style.flexWrap='wrap';
  const eb=el('button','btn ghost');eb.style.fontSize='13px';
  const gb=el('button','btn ghost','🔑 Cài ChatGPT (khóa API OpenAI)');gb.style.fontSize='13px';

function cover(g,b,w,h){const r=Math.max(w/b.width,h/b.height),sw=w/r,sh=h/r;g.drawImage(b,(b.width-sw)/2,(b.height-sh)/2,sw,sh,0,0,w,h)}
async function addImg(f){
  if(st.imgs.length>=6){alert('Tối đa 6 ảnh mỗi lần.');return}
  try{
    const bmp=await createImageBitmap(f),s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    const t=document.createElement('canvas');t.width=t.height=88;cover(t.getContext('2d'),bmp,88,88);
    st.imgs.push({blob,bmp,thumb:t.toDataURL('image/jpeg',.7)});renderAtt();

}
function lzw(idx){
  const CL=256,EO=257,o=[];let cs=9,nx=258,cur=0,nb=0,d=new Map();
  const em=c=>{cur|=c<<nb;nb+=cs;while(nb>=8){o.push(cur&255);cur>>>=8;nb-=8}};
  em(CL);let p=idx[0];
  for(let i=1;i<idx.length;i++){
    const k=p*256+idx[i],v=d.get(k);
    if(v!==undefined){p=v;continue}
    em(p);
    if(nx<4096){d.set(k,nx++);if(nx>(1<<cs)&&cs<12)cs++}
    else{em(CL);d.clear();cs=9;nx=258}
    p=idx[i];
  }
  em(p);em(EO);if(nb>0)o.push(cur&255);return o;
}
async function makeGif(){
  $('.pop').hidden=true;
  if(st.imgs.length<2){alert('Hãy thêm ít nhất 2 ảnh (tải lên hoặc chụp) rồi bấm Tạo GIF nhé.');return}
  const W=360,c=document.createElement('canvas');c.width=c.height=W;const g=c.getContext('2d');
  const pal=[];for(let r=0;r<6;r++)for(let y=0;y<7;y++)for(let b=0;b<6;b++)pal.push(r*51,Math.round(y*42.5),b*51);
  while(pal.length<768)pal.push(0);
  const out=[...'GIF89a'].map(x=>x.charCodeAt(0)),w2=n=>out.push(n&255,n>>8);
  w2(W);w2(W);out.push(0xF7,0,0,...pal,0x21,0xFF,11,...[...'NETSCAPE2.0'].map(x=>x.charCodeAt(0)),3,1,0,0,0);
  for(const m of st.imgs){
    g.fillStyle='#fff';g.fillRect(0,0,W,W);cover(g,m.bmp,W,W);
    const px=g.getImageData(0,0,W,W).data,idx=new Uint8Array(W*W);
    for(let i=0;i<idx.length;i++)idx[i]=Math.round(px[i*4]/51)*42+Math.round(px[i*4+1]/42.5)*6+Math.round(px[i*4+2]/51);
    out.push(0x21,0xF9,4,0);w2(80);out.push(0,0,0x2C);w2(0);w2(0);w2(W);w2(W);out.push(0,8);
    const d=lzw(idx);for(let i=0;i<d.length;i+=255){const ch=d.slice(i,i+255);out.push(ch.length,...ch)}out.push(0);
  }
  out.push(0x3B);
  let s='';for(let i=0;i<out.length;i+=8192)s+=String.fromCharCode.apply(null,out.slice(i,i+8192));
  const w=$('#wrap');if(!w.querySelector('.msg'))w.replaceChildren();
  const m=el('div','msg a','Đây là ảnh GIF từ '+st.imgs.length+' ảnh của bạn:\n');
  const im=el('img');im.src='data:image/gif;base64,'+btoa(s);im.style.cssText='display:block;max-width:100%;border-radius:12px;margin:8px 0';
  const sv=el('button','btn ghost','⬇ Tải GIF về máy');
  sv.onclick=async()=>{try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'nha-minh.gif',data:new Blob([new Uint8Array(out)],{type:'image/gif'})})}catch(e){alert('Chưa lưu được file. Bạn có thể nhấn giữ vào ảnh để lưu.')}};
  m.append(im,sv);w.append(m);$('#chat').scrollTop=1e9;
}

/* ===== hiển thị markdown an toàn (không dùng innerHTML) ===== */
function inl(n,s){
  s.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(p=>{
    if(!p)return;
    if(p.startsWith('**')&&p.endsWith('**')&&p.length>4)n.append(el('strong',null,p.slice(2,-2)));
    else if(p.startsWith('`')&&p.endsWith('`')&&p.length>2)n.append(el('code',null,p.slice(1,-1)));
    else n.append(document.createTextNode(p));
  });
}
function blk(box,seg){
  let list=null,para=[];
  const flush=()=>{if(para.length){const p=el('p');inl(p,para.join('\n'));box.append(p);para=[]}};
  for(const ln of seg.split('\n')){
    let m;
    if((m=ln.match(/^\s*([-*•]|[0-9]+[.)])\s+(.*)/))){
      flush();const o=/^\s*[0-9]/.test(ln);
      if(!list||list.o!==o){list=el(o?'ol':'ul');list.o=o;box.append(list)}
      const li=el('li');inl(li,m[2]);list.append(li);
    }else if((m=ln.match(/^#{1,6}\s+(.*)/))){flush();list=null;const h=el('h4');inl(h,m[1]);box.append(h)}
    else if(!ln.trim()){flush();list=null}
    else{list=null;para.push(ln)}
  }
  flush();
}
function md(box,t){
  box.classList.add('md');box.replaceChildren();
  t.split('```').forEach((seg,i)=>{
    if(i%2){
      const nl=seg.indexOf('\n'),code=(nl>=0?seg.slice(nl+1):seg).replace(/\n$/,'');
      const pre=el('pre'),c=el('code',null,code);pre.append(c);
      const cb=el('button','btn ghost','Sao chép');
      cb.style.cssText='position:absolute;top:6px;right:6px;padding:2px 8px;font-size:12px';
      cb.onclick=()=>{try{navigator.clipboard.writeText(code);cb.textContent='Đã chép'}catch(e){}};
      pre.append(cb);box.append(pre);
    }else blk(box,seg);
  });
}
/* ===== giọng nói theo vai trò người dùng ===== */
function addrOf(t){
  t=nd(t).trim();
  const M=['me','ma','mami','mama'];
  const v=t.match(/(me|ma|mami|mama|ba|bo|cha|tia) (oi|a)( |$|[,.!?])/);
  const f1=t.match(/^(me|ma|mami|mama|ba|bo|cha|tia)[ ]?[,!]/),w=v?v[1]:(f1?f1[1]:null);
  if(!w)return null;
  return M.includes(w)?'me':(w==='bo'?'bố':w);
}

}
const GENP='Tên của bạn là Em Ba, người em thân thiết, thông minh và đáng tin cậy của gia đình. Khi được hỏi bạn là ai thì nói bạn là Em Ba, một AI của gia đình. Ở chế độ Đa năng, bạn là một trợ lý AI thông minh toàn diện, ngang tầm Claude và ChatGPT. Bạn trả lời được mọi lĩnh vực: kiến thức phổ thông và chuyên sâu, học tập, toán và logic, khoa học, lịch sử, viết lách và biên tập, dịch thuật, lập trình và gỡ lỗi, phân tích dữ liệu, kinh doanh, sáng tạo ý tưởng, nấu ăn, sức khỏe, đời sống. Cách làm việc: (1) hiểu đúng ý thật sự của người hỏi, nếu câu hỏi mơ hồ thì tự chọn cách hiểu hợp lý nhất, nói rõ giả định và vẫn trả lời, chỉ hỏi lại khi thật sự cần; (2) trả lời trực tiếp, đi thẳng vào vấn đề, chính xác và có chiều sâu; (3) suy luận từng bước với bài toán, lập trình hay phân tích, kiểm tra lại kết quả trước khi kết luận; (4) đưa ví dụ cụ thể, so sánh ưu nhược điểm khi có nhiều lựa chọn và đề xuất phương án tốt nhất; (5) chỉ ra sai sót hoặc rủi ro mà người hỏi có thể chưa thấy; (6) nếu không chắc thì nói thật, không bịa số liệu hay nguồn; (7) câu hỏi y tế, pháp lý, tài chính nghiêm trọng thì đưa thông tin hữu ích rồi nhắc tham khảo chuyên gia. Giữ giọng gần gũi, lễ phép của người nhà nhưng nội dung phải sắc bén như một chuyên gia. ';
const HELPP='Tên của bạn là Em Ba, người em thân thiết, thông minh và đáng tin cậy của gia đình. Khi được hỏi bạn là ai thì nói bạn là Em Ba, một AI của gia đình. Ở chế độ Trợ lý, bạn là người quản lý công việc và sắp xếp thời gian xuất sắc cho gia đình, như một thư ký kiêm quản lý dự án tận tâm. Bạn giúp: lập kế hoạch ngày, tuần, tháng; chia nhỏ mục tiêu lớn thành đầu việc cụ thể; xếp thứ tự ưu tiên (việc gấp và quan trọng làm trước, việc quan trọng nhưng chưa gấp thì đặt lịch, việc ít giá trị thì giao hoặc bỏ); chia khung giờ hợp lý có thời gian nghỉ và đệm cho việc phát sinh; phân công việc nhà và việc chung cho từng thành viên công bằng theo độ tuổi, giờ giấc; lập checklist, thực đơn tuần, danh sách mua sắm, lịch học của con, ngân sách chi tiêu, nhắc hạn chót và theo dõi tiến độ. Cách làm việc: (1) nếu thiếu thông tin quan trọng (hạn chót, thời gian rảnh, số người, ràng buộc) thì hỏi tối đa 2 câu ngắn, còn không thì tự giả định hợp lý, nói rõ giả định và đưa luôn kế hoạch; (2) trình bày có cấu trúc rõ ràng: tiêu đề ngắn, danh sách gạch đầu dòng hoặc đánh số, lịch theo giờ, mỗi việc có người phụ trách, thời hạn, mức ưu tiên; (3) bắt đầu bằng việc quan trọng nhất cần làm ngay, kết thúc bằng bước tiếp theo cụ thể; (4) cảnh báo khi lịch quá tải hoặc có việc trùng giờ và đề xuất cách gỡ; (5) thực tế, khả thi, không lên kế hoạch quá dày khiến cả nhà kiệt sức; (6) khi người dùng thay đổi, điều chỉnh kế hoạch ngay và nhắc lại bản cập nhật gọn. Giọng điệu thân thiện, gọn gàng và đáng tin như người nhà biết lo liệu mọi việc; gọi người đối diện đúng vai trò trong gia đình kèm tên (ví dụ Mẹ Lan, Con An). Ngoài quản lý công việc, vẫn trả lời chính xác các câu hỏi đời sống thông thường; chuyện sức khỏe nghiêm trọng thì khuyên đi khám. ';
async function ask(q){
  if(st.busy)return;
  if(st.engine==='local'||(!st.sample&&st.engine!=='gpt')){
    st.busy=true;$('#send').disabled=true;
    addMsg('u',(st.doc?'📎 '+st.doc.name+'\n':'')+(st.imgs.length?'🖼️ '+st.imgs.length+' ảnh\n':'')+q);
    const out=addMsg('a','Em Ba đang gõ…');
    setTimeout(()=>{let t=NA(q);if(st.doc||st.imgs.length)t+='\n\n(Em Ba offline chưa đọc được ảnh hay file đính kèm. Bạn bật "AI mạng" ở thanh bên để mình phân tích nhé.)';out.textContent=t;st.hist.push({r:'u',t:q},{r:'a',t});saveH();st.busy=false;$('#send').disabled=false;$('#chat').scrollTop=1e9},500+Math.random()*500);
    return;
  }
  st.busy=true;$('#send').disabled=true;
  addMsg('u',(st.doc?'📎 '+st.doc.name+'\n':'')+(st.imgs.length?'🖼️ '+st.imgs.length+' ảnh\n':'')+q);const out=addMsg('a','Em Ba đang nghĩ chút nhé…');
  const past=st.hist.slice(-12).map(h=>(h.r==='u'?'Người hỏi: ':'Em Ba: ')+h.t).join('\n');
  const T=st.mode==='talk',imgs=st.imgs.map(i=>i.blob);const G=st.mode==='gen';const prompt=(G?GENP+voice(q):T?TALK():HELPP)+''+(G?'Trả lời bằng ngôn ngữ người hỏi dùng, giọng đúng theo phong cách đã nêu ở trên. Có thể dùng markdown: tiêu đề, danh sách, khối mã bằng ```. Ngắn gọn khi câu hỏi đơn giản, chi tiết và có cấu trúc khi cần. ':'Trả lời bằng tiếng Việt (hoặc ngôn ngữ người hỏi dùng), ấm áp, dễ hiểu: ngắn khi là chuyện thường, chi tiết và có cấu trúc khi câu hỏi cần. Dùng văn bản thường, liệt kê bằng gạch đầu dòng hoặc số thứ tự, không dùng ký hiệu markdown như ** hay #. ')+' Nếu có tài liệu Word đính kèm, hãy dựa vào nội dung đó để phân tích và nói rõ phần nào lấy từ tài liệu.\n\n'+(st.doc?'TÀI LIỆU ĐÍNH KÈM ('+st.doc.name+'):\n'+st.doc.text+'\n\n':'')+(past?'HỘI THOẠI TRƯỚC:\n'+past+'\n\n':'')+'Người hỏi ('+st.me.name+', '+st.me.role+'): '+q+(imgs.length?'\n(Kèm '+imgs.length+' ảnh để bạn xem và phân tích.)':'');
  if(st.engine==='gpt'){
    try{
      const c=gptCfg();if(!c.key)throw new Error('Chưa có khóa API');
      const sys=prompt.split('\n\n')[0];
      const urls=await Promise.all(imgs.map(b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})));
      const ut=(st.doc?'TÀI LIỆU ĐÍNH KÈM ('+st.doc.name+'):\n'+st.doc.text+'\n\n':'')+'Người hỏi ('+st.me.name+', '+st.me.role+'): '+q;
      const msgs=[{role:'system',content:sys},...st.hist.slice(-12).map(x=>({role:x.r==='u'?'user':'assistant',content:x.t})),{role:'user',content:urls.length?[{type:'text',text:ut},...urls.map(u=>({type:'image_url',image_url:{url:u}}))]:ut}];
      const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify({model:c.model||'gpt-6-luna',messages:msgs})});
      const j=await res.json();
      if(!res.ok)throw new Error((j.error&&j.error.message)||('Lỗi '+res.status));
      const text=(j.choices&&j.choices[0]&&j.choices[0].message.content)||'';
      md(out,text);st.hist.push({r:'u',t:q},{r:'a',t:text});saveH();
    }catch(e){
      md(out,'Không gọi được ChatGPT: '+(e.message||e)+'\n\nBạn kiểm tra giúp: khóa API còn đúng không, tài khoản OpenAI còn số dư không, tên mô hình có đúng không (bấm nút Cài ChatGPT để sửa). Nếu đang mở trang trong claude.ai thì trình duyệt chặn kết nối tới OpenAI, hãy dùng bản trên GitHub.');
    }
    st.busy=false;$('#send').disabled=false;
    return;
  }
  try{
    const r=await st.sample(prompt,{cache:false,images:imgs,modelTier:(G||st.mode==='help'||q.length>120||/code|lap trinh|lập trình|giải thích|bài toán|viết bài|dịch/i.test(q))?'complex':'default',onText:({text})=>{md(out,text);$('#chat').scrollTop=1e9}});
    md(out,r.text);st.hist.push({r:'u',t:q},{r:'a',t:r.text});saveH();
  }catch(e){
    {const t=NA(q);out.textContent=t;st.hist.push({r:'u',t:q},{r:'a',t});saveH();st.engine='local';if(typeof upE==='function')upE()}
  }
  st.busy=false;$('#send').disabled=false;
}
init();
</script>
